<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs>
    <!-- Gradient for sea areas -->
    <linearGradient id="seaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a7c59;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#2d5a3d;stop-opacity:0.8"/>
    </linearGradient>
    <!-- Pattern for sand dots -->
    <pattern id="sandPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="3" fill="#d4a017" opacity="0.9"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="700" fill="#f5f0e1"/>
  
  <!-- Legend (top-left) -->
  <g transform="translate(20, 30)" font-family="Georgia, serif" font-size="11">
    <rect x="0" y="0" width="12" height="8" fill="#c41e3a"/>
    <text x="18" y="8" fill="#333">rot die Berge.</text>
    <rect x="0" y="14" width="12" height="8" fill="#d4a017"/>
    <text x="18" y="22" fill="#333">gelb der Sand.</text>
    <rect x="0" y="28" width="12" height="8" fill="#6b7b8c"/>
    <text x="18" y="36" fill="#333">graublau die Flüsse</text>
    <rect x="0" y="42" width="12" height="8" fill="#4a7c59"/>
    <text x="18" y="50" fill="#333">grün die Meere.</text>
  </g>
  
  <!-- Compass (top-right) -->
  <g transform="translate(720, 50)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#333" stroke-width="1"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#333" stroke-width="1"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#333" stroke-width="1"/>
    <text x="0" y="-28" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333">N</text>
    <text x="0" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333">S</text>
    <text x="-32" y="4" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333">W</text>
    <text x="32" y="4" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333">E</text>
    <!-- Arrow head -->
    <polygon points="0,-20 -4,-12 4,-12" fill="#333"/>
  </g>
  
  <!-- Main circular map boundary -->
  <ellipse cx="400" cy="350" rx="350" ry="300" fill="#f8f4e8" stroke="#2d4a3d" stroke-width="4"/>
  
  <!-- Inner decorative border -->
  <ellipse cx="400" cy="350" rx="340" ry="290" fill="none" stroke="#4a7c59" stroke-width="2"/>
  
  <!-- Sea areas (Green) - Caspian Sea region (left side) -->
  <path d="M 80 280 Q 60 350 80 420 Q 100 450 120 420 Q 130 350 120 280 Q 100 250 80 280" 
        fill="#4a7c59" opacity="0.7"/>
  
  <!-- Sea area - Mediterranean/Black Sea representation -->
  <path d="M 100 480 Q 150 520 200 500 Q 180 470 100 480" 
        fill="#4a7c59" opacity="0.7"/>
  
  <!-- Rivers (Gray-blue lines) -->
  <!-- Syr Darya / Jaxartes -->
  <path d="M 180 200 Q 250 250 300 280 Q 350 300 400 310 Q 450 315 500 300" 
        fill="none" stroke="#6b7b8c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Amu Darya / Oxus -->
  <path d="M 150 350 Q 200 380 280 400 Q 350 410 420 390" 
        fill="none" stroke="#6b7b8c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Tarim River -->
  <path d="M 500 250 Q 550 280 600 270 Q 650 260 680 240" 
        fill="none" stroke="#6b7b8c" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Ili River -->
  <path d="M 450 180 Q 500 200 550 190 Q 580 180 600 160" 
        fill="none" stroke="#6b7b8c" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Mountain ranges (Red contour lines) -->
  <!-- Tian Shan Mountains - main range -->
  <path d="M 380 150 Q 420 140 480 160 Q 540 180 600 170 Q 660 160 700 150" 
        fill="none" stroke="#c41e3a" stroke-width="4" stroke-linecap="round"/>
  <path d="M 400 170 Q 450 160 500 175 Q 560 190 620 185" 
        fill="none" stroke="#c41e3a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Pamir Mountains -->
  <path d="M 520 280 Q 560 300 580 340 Q 590 380 580 420" 
        fill="none" stroke="#c41e3a" stroke-width="4" stroke-linecap="round"/>
  <path d="M 540 290 Q 575 310 590 350 Q 595 390 585 430" 
        fill="none" stroke="#c41e3a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Hindu Kush -->
  <path d="M 460 420 Q 500 450 540 460 Q 580 470 620 480" 
        fill="none" stroke="#c41e3a" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Altai Mountains (north) -->
  <path d="M 450 100 Q 500 90 550 95 Q 600 100 650 95" 
        fill="none" stroke="#c41e3a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Kunlun Mountains -->
  <path d="M 580 320 Q 630 340 680 350 Q 720 360 740 370" 
        fill="none" stroke="#c41e3a" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Zagros Mountains (west) -->
  <path d="M 200 400 Q 180 450 170 500 Q 165 540 180 570" 
        fill="none" stroke="#c41e3a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Kopet Dag -->
  <path d="M 220 380 Q 260 400 300 410 Q 340 415 380 410" 
        fill="none" stroke="#c41e3a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Sand regions (Yellow dots) - Taklamakan Desert -->
  <g fill="#d4a017" opacity="0.9">
    <circle cx="520" cy="240" r="4"/>
    <circle cx="550" cy="250" r="4"/>
    <circle cx="580" cy="245" r="4"/>
    <circle cx="610" cy="250" r="4"/>
    <circle cx="540" cy="270" r="4"/>
    <circle cx="570" cy="275" r="4"/>
    <circle cx="600" cy="270" r="4"/>
    <circle cx="555" cy="295" r="4"/>
    <circle cx="585" cy="300" r="4"/>
  </g>
  
  <!-- Sand - Karakum Desert -->
  <g fill="#d4a017" opacity="0.9">
    <circle cx="280" cy="340" r="4"/>
    <circle cx="310" cy="350" r="4"/>
    <circle cx="340" cy="345" r="4"/>
    <circle cx="295" cy="370" r="4"/>
    <circle cx="325" cy="375" r="4"/>
    <circle cx="355" cy="365" r="4"/>
    <circle cx="265" cy="360" r="4"/>
  </g>
  
  <!-- Sand - Kyzylkum Desert -->
  <g fill="#d4a017" opacity="0.9">
    <circle cx="300" cy="280" r="4"/>
    <circle cx="330" cy="290" r="4"/>
    <circle cx="360" cy="285" r="4"/>
    <circle cx="315" cy="310" r="4"/>
    <circle cx="345" cy="315" r="4"/>
    <circle cx="375" cy="305" r="4"/>
  </g>
  
  <!-- Sand - Gobi region -->
  <g fill="#d4a017" opacity="0.9">
    <circle cx="620" cy="200" r="4"/>
    <circle cx="650" cy="210" r="4"/>
    <circle cx="640" cy="230" r="4"/>
    <circle cx="670" cy="225" r="4"/>
  </g>
  
  <!-- Additional scattered sand dots -->
  <g fill="#d4a017" opacity="0.85">
    <circle cx="420" cy="280" r="3"/>
    <circle cx="450" cy="290" r="3"/>
    <circle cx="480" cy="285" r="3"/>
    <circle cx="435" cy="310" r="3"/>
    <circle cx="465" cy="305" r="3"/>
  </g>
  
  <!-- Place names - Major cities and regions -->
  <g font-family="Georgia, serif" fill="#333" font-size="10">
    <!-- Northern regions -->
    <text x="400" y="95" text-anchor="middle" font-style="italic">gābrākā</text>
    <text x="500" y="115" text-anchor="middle" font-style="italic">māsīn</text>
    <text x="320" y="130" text-anchor="middle" font-style="italic">baldat al 'alīna</text>
    <text x="250" y="150" text-anchor="middle" font-style="italic">gafū</text>
    
    <!-- Turkic regions (center-north) -->
    <text x="440" y="150" text-anchor="middle" font-weight="bold" font-size="11">hātūn saīnī</text>
    <text x="530" y="160" text-anchor="middle">bilād uīgur</text>
    <text x="350" y="180" text-anchor="middle">bīšbulak</text>
    <text x="420" y="185" text-anchor="middle">ganbulak</text>
    <text x="490" y="175" text-anchor="middle">kūǧū</text>
    <text x="560" y="170" text-anchor="middle">salām</text>
    
    <!-- Central Asian cities -->
    <text x="280" y="210" text-anchor="middle" font-size="11">fīǧāfī bāškent</text>
    <text x="380" y="215" text-anchor="middle">fīǧāfī jamak</text>
    <text x="300" y="245" text-anchor="middle" font-style="italic">ūādī ile</text>
    <text x="220" y="265" text-anchor="middle">fīǧāfī saumal</text>
    <text x="350" y="255" text-anchor="middle">fīǧāfī tatār</text>
    
    <!-- Important Turkic cities -->
    <text x="250" y="300" text-anchor="middle" font-weight="bold" font-size="12">baldat sakāl muhdat kaf</text>
    <text x="200" y="330" text-anchor="middle">bulgār</text>
    <text x="280" y="355" text-anchor="middle" font-style="italic">ǧebel karāǧolk</text>
    <text x="320" y="380" text-anchor="middle">bilād al ǧazna</text>
    
    <!-- Kashgar region (highlighted) -->
    <text x="480" y="280" text-anchor="middle" font-weight="bold" font-size="13" fill="#8b0000">kašǧarī</text>
    <text x="530" y="310" text-anchor="middle">jārkend</text>
    <text x="440" y="320" text-anchor="middle">bālāsāgūn</text>
    <text x="400" y="340" text-anchor="middle">kasgān</text>
    
    <!-- Ferghana Valley -->
    <text x="380" y="365" text-anchor="middle" font-style="italic">ferġānān</text>
    <text x="320" y="400" text-anchor="middle">māwara</text>
    
    <!-- Persian/Arab regions (south) -->
    <text x="260" y="440" text-anchor="middle">būxārezm</text>
    <text x="340" y="460" text-anchor="middle">ramī</text>
    <text x="420" y="480" text-anchor="middle" font-size="11">arḍ xorāsān</text>
    <text x="300" y="500" text-anchor="middle">arḍ al ǧilalma</text>
    <text x="380" y="520" text-anchor="middle">arḍ āderbāīǧān</text>
    <text x="480" y="520" text-anchor="middle">arḍ al 'irākīn</text>
    
    <!-- Arabia and beyond -->
    <text x="250" y="550" text-anchor="middle" font-size="11">arḍ al šām</text>
    <text x="340" y="565" text-anchor="middle">arḍ al akrād</text>
    <text x="420" y="560" text-anchor="middle">ḥudūd miṣr</text>
    <text x="510" y="550" text-anchor="middle" font-weight="bold">arḍ al ḥeǧāz</text>
    <text x="280" y="590" text-anchor="middle" font-style="italic">al iskanderīja</text>
    <text x="450" y="590" text-anchor="middle">arḍ al kāīrouān ūa ǧaīruha</text>
    
    <!-- Eastern regions -->
    <text x="620" cy="280" text-anchor="middle">kāšmīn</text>
    <text x="680" y="300" text-anchor="middle" font-style="italic">serandīb</text>
    <text x="700" y="330" text-anchor="middle">ǧebel serandīb</text>
    <text x="680" y="360" text-anchor="middle">bilād hind</text>
    <text x="660" y="400" text-anchor="middle">selīūn</text>
    <text x="700" y="430" text-anchor="middle">bilād sind</text>
    
    <!-- Indian subcontinent region -->
    <text x="580" y="480" text-anchor="middle">bilād karma</text>
    <text x="530" y="500" text-anchor="middle">bilād fārs</text>
    <text x="620" y="510" text-anchor="middle">bilād ḥuzīstān</text>
    <text x="680" y="530" text-anchor="middle">arḍ al jamen</text>
    <text x="620" y="570" text-anchor="middle">bilād al zang</text>
    
    <!-- Far east labels -->
    <text x="720" y="250" text-anchor="middle" font-size="9" fill="#666">maḥbaṭ Ādam aleīhi</text>
    <text x="720" y="265" text-anchor="middle" font-size="9" fill="#666">as salām</text>
  </g>
  
  <!-- Directional labels on edges -->
  <text x="60" y="350" font-family="Georgia, serif" font-size="14" fill="#2d4a3d" 
        transform="rotate(-90, 60, 350)">Nord</text>
  <text x="740" y="350" font-family="Georgia, serif" font-size="14" fill="#2d4a3d"
        transform="rotate(90, 740, 350)">Süd</text>
  
  <!-- Decorative elements on edges -->
  <g fill="#c41e3a" opacity="0.6">
    <!-- Top decorative curves -->
    <path d="M 350 55 Q 400 45 450 55" fill="none" stroke="#c41e3a" stroke-width="2"/>
    <path d="M 360 60 Q 400 52 440 60" fill="none" stroke="#c41e3a" stroke-width="1.5"/>
  </g>
  
  <!-- Title at bottom -->
  <text x="100" y="660" font-family="Georgia, serif" font-size="16" fill="#333" font-weight="bold">Karte</text>
  <text x="100" y="680" font-family="Georgia, serif" font-size="14" fill="#333">der Turkstämme</text>
  <text x="680" y="670" font-family="Georgia, serif" font-size="12" fill="#666">466 d. Flucht.</text>
  
  <!-- Tree symbol (center top, representing the world tree/axis mundi) -->
  <g transform="translate(500, 120)">
    <path d="M 0 0 L 0 25" stroke="#2d5a3d" stroke-width="3"/>
    <ellipse cx="0" cy="-5" rx="12" ry="15" fill="#4a7c59"/>
    <ellipse cx="-8" cy="0" rx="8" ry="10" fill="#4a7c59"/>
    <ellipse cx="8" cy="0" rx="8" ry="10" fill="#4a7c59"/>
  </g>
  
  <!-- Tower/Minaret symbol (west side) -->
  <g transform="translate(140, 380)">
    <rect x="-8" y="0" width="16" height="40" fill="#333"/>
    <polygon points="-10,0 0,-15 10,0" fill="#333"/>
  </g>
</svg>
